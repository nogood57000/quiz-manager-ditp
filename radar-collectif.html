<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Restitution Collective</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white p-4 flex flex-col items-center justify-center min-h-[420px] select-none">
  
  <div class="w-full text-center mb-2">
    <h2 class="text-base font-bold text-slate-800 uppercase tracking-wide">Profil Moyen du Collectif Managers</h2>
    <p class="text-xs text-slate-400">Positionnement moyen consolidé (échelle 1 à 4)</p>
  </div>

  <div class="relative w-full max-w-[390px] aspect-square">
    <canvas id="radarGroupChart"></canvas>
  </div>

  <script>
    let groupChart = null;

    function initChart() {
      const ctx = document.getElementById('radarGroupChart').getContext('2d');
      groupChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['Communication', "Gestion d'équipe", 'Adaptation', 'Leadership'],
          datasets: [{
            label: 'Moyenne groupe',
            data: [0, 0, 0, 0],
            backgroundColor: 'rgba(16, 185, 129, 0.22)', // Teinte émeraude pour distinguer le collectif
            borderColor: 'rgba(16, 185, 129, 1)',
            borderWidth: 2.5,
            pointBackgroundColor: 'rgba(16, 185, 129, 1)',
            pointBorderColor: '#fff',
            pointRadius: 4.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          layout: {
            padding: { top: 10, bottom: 10, left: 25, right: 25 }
          },
          scales: {
            r: {
              min: 0,
              max: 4,
              ticks: {
                stepSize: 1,
                display: true,
                backdropColor: 'transparent',
                font: { size: 10 }
              },
              pointLabels: {
                font: { size: 12, weight: '700' },
                color: '#1e293b'
              },
              grid: { color: '#f1f5f9' },
              angleLines: { color: '#e2e8f0' }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    initChart();

    grist.ready({ requiredAccess: 'read table' });

    // Lit la ligne unique de GROUPE_SYNTHESE
    grist.onRecord(record => {
      if (!record) return;

      const comm = parseFloat(record.Moyenne_Communication) || 0;
      const equipe = parseFloat(record.Moyenne_Gestion_Equipe || record.Moyenne_Gestion_E) || 0;
      const adapt = parseFloat(record.Moyenne_Adaptation) || 0;
      const lead = parseFloat(record.Moyenne_Leadership) || 0;

      groupChart.data.datasets[0].data = [comm, equipe, adapt, lead];
      groupChart.update();
    });
  </script>
</body>
</html>

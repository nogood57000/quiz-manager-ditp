<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-évaluation Managériale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100/90 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-slate-200/80 p-5 sm:p-8 relative">

    <!-- BANDEAU D'ENVIRONNEMENT -->
    <div id="env-badge-container" class="mb-4">
      <span id="env-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wide uppercase">
        <span class="w-2 h-2 rounded-full" id="env-dot"></span>
        <span id="env-text">Session de formation</span>
      </span>
    </div>

    <!-- ÉCRAN 1 : IDENTIFICATION -->
    <div id="step-intro">
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mb-2">Auto-évaluation Managériale</h1>
      <p class="text-xs sm:text-sm text-slate-600 mb-6 leading-relaxed">
        Ce questionnaire explore vos pratiques professionnelles sur 4 dimensions : 
        <strong>Communication, Gestion d'équipe, Adaptation et Leadership</strong>.
        Votre radar individuel apparaîtra instantanément à l'issue des 20 questions.
      </p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nom *</label>
          <input type="text" id="user-nom" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex. DUPONT">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Prénom</label>
          <input type="text" id="user-prenom" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex. Claire">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Fonction</label>
          <input type="text" id="user-fonction" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ex. Responsable d'unité">
        </div>

        <div class="pt-2">
          <button type="button" onclick="demarrerQuiz()" class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 active:scale-[0.99] transition shadow-sm cursor-pointer text-sm sm:text-base">
            Commencer le questionnaire →
          </button>
        </div>
      </div>
    </div>

    <!-- ÉCRAN 2 : QUESTIONNAIRE -->
    <div id="step-quiz" class="hidden">
      <div class="mb-5">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
          <span id="dimension-tag" class="text-indigo-600 font-bold">Dimension</span>
          <span id="step-counter">Question 1 / 20</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
          <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 5%"></div>
        </div>
      </div>

      <div class="min-h-[75px] sm:min-h-[90px] flex items-center mb-5">
        <h2 id="question-text" class="text-base sm:text-lg font-medium text-slate-800 leading-snug"></h2>
      </div>

      <div id="options-container" class="grid grid-cols-1 gap-2.5 mb-6"></div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-100">
        <button type="button" id="prev-btn" onclick="prevQuestion()" class="px-3.5 py-2 text-xs sm:text-sm font-medium text-slate-500 hover:text-slate-800 disabled:opacity-30 disabled:pointer-events-none cursor-pointer">
          ← Précédent
        </button>
        <button type="button" id="next-btn" onclick="nextQuestion()" disabled class="px-5 py-2.5 text-xs sm:text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-40 disabled:pointer-events-none shadow-sm transition cursor-pointer">
          Suivant →
        </button>
      </div>
    </div>

    <!-- ÉCRAN 3 : RESTITUTION & TRANSMISSION SANS CLÉ API -->
    <div id="step-success" class="hidden text-center py-2">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-
